# Local Postgres for dev and tests. Production uses Neon (design D2).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: restaurant
    ports:
      - "5432:5432"
    volumes:
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
