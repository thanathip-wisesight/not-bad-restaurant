schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Bilingual artifacts: English files are the source of truth and the working copy.
  Every change artifact (proposal, specs, design, tasks) also gets a Thai translation
  under `openspec/changes/<change>/th/` mirroring the English paths
  (`th/proposal.md`, `th/design.md`, `th/tasks.md`, `th/specs/<capability>/spec.md`).
  Never put Thai files under the change's `specs/` folder (OpenSpec would treat them
  as spec deltas). Main specs get their Thai translation as a sibling file
  `openspec/specs/<capability>/spec.th.md` (OpenSpec ignores it); never use a `th/`
  folder under `openspec/specs/` (OpenSpec would list it as a capability). When an
  archive syncs a delta into `spec.md`, update the sibling `spec.th.md` in the same step.
  The human-readable aggregate of the main specs is `docs/SPEC.md` with its Thai
  translation `docs/SPEC.th.md`.
  Thai files start with a note naming the English source, keep requirement, scenario,
  and task numbering identical to the English, keep code, paths, identifiers, status
  names, and SHALL/MUST/WHEN/THEN keywords in English, and use plain numbered bullets
  in `th/tasks.md` (no checkboxes, so progress is tracked only in the English file).
  Whenever an English artifact changes, update its Thai translation in the same step.
